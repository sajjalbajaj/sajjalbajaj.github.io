name: Check article structure

on:
  push:
    paths: ['_posts/**', 'scripts/check_content.rb', 'scripts/check_originality.py', 'scripts/test_check_originality.py', '.github/workflows/content-quality.yml']
  pull_request:
    paths: ['_posts/**', 'scripts/check_content.rb', 'scripts/check_originality.py', 'scripts/test_check_originality.py', '.github/workflows/content-quality.yml']

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: '3.3'
      - name: Check every article
        run: ruby scripts/check_content.rb
      - name: Review repeated prose
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_originality.py
      - name: Apply the full standard to new articles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          added_posts=$(mktemp)
          git diff --name-only --diff-filter=A -z "$BASE_SHA" "$HEAD_SHA" -- '_posts/*.md' > "$added_posts"
          mapfile -d '' posts < "$added_posts"
          rm "$added_posts"
          if (( ${#posts[@]} )); then
            ruby scripts/check_content.rb --strict "${posts[@]}"
            python3 scripts/check_originality.py --strict "${posts[@]}"
          fi
