title: Sajjal Bajaj
tagline: ERP Consultant & Project Manager
description: >-
  Daily notes on IT, ERP, Power BI, AI, DevOps and software delivery from
  Sajjal Bajaj, ERP Consultant, Project Manager and Certified ScrumMaster.
author: Sajjal Bajaj
email: sajjalbajaj@gmail.com
lang: en

url: "https://www.sajjalbajaj.in"
baseurl: ""

# Pretty per-post URLs, e.g. /blog/2026/07/23/welcome/
permalink: /blog/:year/:month/:day/:title/

# Posts publish only on/after their date. A daily GitHub Action rebuilds the site,
# so date-scheduled posts go live on their day (the drip-publish mechanism).
future: false
timezone: Asia/Kolkata

# Comments. provider: cusdis | disqus | "" (blank hides comments).
# For Cusdis (free, no ads): sign up at https://cusdis.com, add a website,
# then paste its App ID (a UUID) below.
comments:
  provider: cusdis
  cusdis_app_id: ""
  cusdis_host: "https://cusdis.com"
  disqus_shortname: ""

# Default social image + SEO metadata (jekyll-seo-tag)
image: /assets/sajjalbajaj.jpg
social:
  name: Sajjal Bajaj
  links:
    - https://www.linkedin.com/in/sajjal-bajaj/
    - https://github.com/sajjalbajaj

# GitHub Pages-supported plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml
  posts_limit: 20

# Case studies collection: one file per project in _case_studies/
collections:
  case_studies:
    output: true
    permalink: /case-studies/:name/

markdown: kramdown

# Give every post the post layout automatically
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case-study

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - blog-post-template.md
  - content-plan
  - cv-pdf
  - .cocoindex
